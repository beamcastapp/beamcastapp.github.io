<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!--
    Beamcast, la schermata d'attesa della Chromecast (.splash, issue #585): la pagina a riposo «Il
    fascio» della #584, in attesa. Un quadro 16:9 dove 1vw della #584 vale 16 unità. Senza
    animazioni resta ferma così: il fascio, il logo al centro e il punto acceso.
  -->
  <defs>
    <radialGradient id="light">
      <stop offset="0" stop-color="#87cff0" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#87cff0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1600" height="900" fill="#0b171d"/>
  <!-- Il fascio e la sua luce: deriva di ±1,6 × ±0,9 vw in 40 s, avanti e indietro. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-25.6 14.4;25.6 -14.4;-25.6 14.4" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" dur="80s" repeatCount="indefinite"/>
    <g fill="#87cff0" fill-opacity="0.05">
      <polygon points="-100,1000 1750,-300 1750,300"/>
      <polygon points="-100,1000 1750,-110 1750,130"/>
    </g>
    <!-- In attesa: una corsa di 4,4 s ogni 11, dal vertice fuori schermo in basso a sinistra. -->
    <g opacity="0">
      <animateTransform attributeName="transform" type="translate" values="-100 1000;76.4 904.64;1399.4 189.44;1664 46.4;1664 46.4" keyTimes="0;0.04;0.34;0.4;1" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0.85;0;0" keyTimes="0;0.04;0.34;0.4;1" dur="11s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="scale" values="0.3;0.45;1.575;1.8;1.8" keyTimes="0;0.04;0.34;0.4;1" dur="11s" repeatCount="indefinite"/>
        <circle cx="0" cy="0" r="128" fill="url(#light)"/>
      </g>
    </g>
  </g>
  <!-- Il logo al centro, che contro la ritenzione sugli OLED scivola di ±0,6 vw in 240 s. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;9.6 -6.4;-8 8;6.4 9.6;0 0" keyTimes="0;0.25;0.5;0.75;1" dur="240s" repeatCount="indefinite"/>
    <!-- Il glifo, 5,4 vw: il fascio e la punta, e il punto che respira in 4 s. -->
    <g fill="#87cff0" transform="translate(568.93 406.8) scale(1.542857) translate(-25 -27)">
      <path d="M38.2,66.2 L59.9,33.9 L74.1,48.1 L41.8,69.8 Z"/>
      <path d="M80,28 L73.2,53.2 L54.8,34.8 Z"/>
      <circle cx="33" cy="75" r="7">
        <animate attributeName="opacity" values="0.3;1;0.3" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>
